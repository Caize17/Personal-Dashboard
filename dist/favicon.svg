<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Base background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <!-- Glass specular overlay -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#glowGrad)" stroke-width="2"/>
  <!-- Dashboard Grid / Spark Icon -->
  <rect x="14" y="14" width="16" height="16" rx="4" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="34" y="14" width="16" height="22" rx="4" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="14" y="34" width="16" height="16" rx="4" fill="#ffffff" fill-opacity="0.75"/>
  <rect x="34" y="40" width="16" height="10" rx="3" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Subtle center glow spark -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
</svg>
