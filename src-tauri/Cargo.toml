[package]
name = "dashboard"
version = "1.0.0"
description = "Amil Personal Dashboard - Finance, Academic, Organization & Accounts Tracker"
authors = ["Amil"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
